# Локальная разработка: база и поиск в контейнерах, приложение — `pnpm dev` на хосте.
#   docker compose up -d
# Полный стек в контейнерах (как в продакшене):
#   docker compose --profile app up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: investnews
      POSTGRES_PASSWORD: investnews
      POSTGRES_DB: investnews
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U investnews']
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.57
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data

  app:
    profiles: ['app']
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://investnews:investnews@postgres:5432/investnews
      MEILI_HOST: http://meilisearch:7700
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

volumes:
  pgdata:
  meilidata:
